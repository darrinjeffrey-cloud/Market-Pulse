openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market
    description: Live futures market monitoring
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market/snapshot:
    get:
      operationId: getMarketSnapshot
      tags: [market]
      summary: Get the latest futures market snapshot
      description: Returns the latest multi-timeframe volume, volatility, trend, and alignment state for supported futures symbols.
      responses:
        "200":
          description: Latest market state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshot"
        "503":
          description: Market data is not currently available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /market/stream:
    get:
      operationId: streamMarketSnapshot
      tags: [market]
      summary: Stream market snapshots
      description: Sends server-sent events containing updated market snapshots as new data becomes available.
      responses:
        "200":
          description: Server-sent market snapshot stream
          content:
            text/event-stream:
              schema:
                type: string
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    TimeframeState:
      type: object
      properties:
        rvol:
          type: number
        atr:
          type: number
        direction:
          type: string
          enum: [BULL, BEAR, NEUTRAL]
        volSpike:
          type: boolean
        close:
          type: number
        volume:
          type: number
        adx:
          type: number
          description: "ADX 0–100: <20 ranging, 20–40 trending, >40 strong"
        rsi:
          type: number
          description: "RSI-14 0–100: >50 bullish momentum, <50 bearish"
        vwap:
          type: number
          description: "VWAP anchored to current UTC calendar day"
        isRTH:
          type: boolean
          description: "True inside US equity futures RTH (13:30–20:00 UTC)"
        confluenceScore:
          type: number
          description: "0–5 count of bias factors confirming the active direction"
        lastUpdated:
          type: string
          format: date-time
          description: "ISO-8601 timestamp of the most recent bar used to compute this timeframe"
      required: [rvol, atr, direction, volSpike, close, volume, adx, rsi, vwap, isRTH, confluenceScore, lastUpdated]
    TradeSetup:
      type: object
      properties:
        entry:
          type: number
        stopLoss:
          type: number
        riskPts:
          type: number
        riskDollarsPerContract:
          type: number
        tp1:
          type: number
        tp2:
          type: number
      required: [entry, stopLoss, riskPts, riskDollarsPerContract, tp1, tp2]
    MarketState:
      type: object
      properties:
        symbol:
          type: string
        lastPrice:
          type: number
        perTimeframeSetup:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TradeSetup"
        timeframes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TimeframeState"
      required: [symbol, lastPrice, timeframes]
    MarketSnapshot:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        source:
          type: string
          enum: [databento, unavailable]
        markets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MarketState"
        message:
          type: [string, "null"]
      required: [timestamp, source, markets, message]
