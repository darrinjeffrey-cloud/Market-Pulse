kind = "data-app"
previewPath = "/"
title = "Sales Dashboard"
description = "An interactive sales dashboard for a retail company tracking revenue by region, month, and product category. Includes KPI cards, trend charts, regional breakdowns, category performance, and a filterable data table — all powered by realistic sample data."
version = "1.0.0"
id = "artifacts/sales-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18816

[services.development]
run = "pnpm --filter @workspace/sales-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sales-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/sales-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18816"
BASE_PATH = "/"
